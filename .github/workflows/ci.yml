name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm test
      - run: npm run check:xsd
